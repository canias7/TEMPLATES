<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Grade Platform</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 800px; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
  th { background: #eee; }
  input { font: inherit; padding: .25rem; }
  input[type="number"] { width: 6rem; }
  .hidden { display: none; }
  #status { margin: 1rem 0; padding: .5rem; background: #ffe; border: 1px solid #ddb; }
  .test-banner { margin: 0 0 1rem; padding: .5rem .75rem; background: #fdf0d5;
                 border: 1px solid #d9a441; font-size: .9rem; }
  #status:empty { display: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<h1>Teacher Grade Platform</h1>
<p class="test-banner"><strong>TEST ENVIRONMENT.</strong> Both accounts are test teachers, and every student name and grade is fictional. No real people or school records are involved.</p>
<div id="status"></div>

<!-- Login -->
<section id="login-view" class="hidden">
  <h2>Teacher login</h2>
  <form id="login-form">
    <p><label>Email <input type="email" id="email" required autocomplete="username"></label></p>
    <p><label>Password <input type="password" id="password" required autocomplete="current-password"></label></p>
    <p><button type="submit">Log in</button></p>
  </form>
</section>

<!-- Dashboard -->
<section id="dashboard-view" class="hidden">
  <div class="bar">
    <p>Logged in as <strong id="who"></strong></p>
    <button id="logout">Log out</button>
  </div>
  <h2>My students</h2>
  <table>
    <thead>
      <tr><th>Student</th><th>Subject</th><th>Grade (0-100)</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
